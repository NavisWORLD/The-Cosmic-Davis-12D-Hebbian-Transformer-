# Medium Model Configuration for 12D Cosmic Synapse Transformer
# Requires 16GB+ GPU (e.g., V100, A100, or RTX 4090)
# Expected training time: ~12-24 hours on V100
# Parameters: ~125M

model:
  vocab_size: 50257  # GPT-2 tokenizer compatible
  max_seq_len: 1024
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_ff: null  # Will be computed as d_model * φ ≈ 1243
  dropout: 0.1

  # 12D Cosmic Synapse Parameters
  k: 0.1          # Internal state decay rate
  gamma: 0.05     # Hebbian learning rate
  sigma: 0.5      # Chaos injection strength
  beta: 0.2       # Lorenz attractor parameter

  # Memory parameters
  memory_size: 128
  memory_dim: 256

training:
  batch_size: 12
  gradient_accumulation_steps: 8
  max_iters: 100000
  eval_interval: 1000
  eval_iters: 200
  log_interval: 100

  # Optimization
  learning_rate: 0.0006
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  # Learning rate schedule
  warmup_iters: 2000
  lr_decay_iters: 100000
  min_lr: 0.00006

  # Device
  device: 'cuda'
  dtype: 'bfloat16'
  compile: true

  # Checkpointing
  out_dir: 'checkpoints/medium_model'
  always_save_checkpoint: true
  init_from: 'scratch'

data:
  data_dir: 'data'
  train_bin: 'train.bin'
  val_bin: 'val.bin'
