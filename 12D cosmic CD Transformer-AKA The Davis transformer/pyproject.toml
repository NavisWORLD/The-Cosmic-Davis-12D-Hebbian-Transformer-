[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-synapse-transformer"
version = "1.0.0"
description = "12D Cosmic Synapse Transformer - Revolutionary AI Architecture based on φ-harmonic dynamics"
authors = [
    {name = "Cory Shane Davis", email = "cory@cosmicsynapse.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = [
    "transformer",
    "deep-learning",
    "neural-networks",
    "ai",
    "machine-learning",
    "cosmic-synapse",
    "12d-theory",
    "golden-ratio",
    "consciousness",
    "hebbian-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "transformers>=4.30.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "jupyter>=1.0.0",
    "ipython>=8.14.0",
]
api = [
    "flask>=2.3.2",
    "flask-cors>=4.0.0",
    "gunicorn>=20.1.0",
]
monitoring = [
    "wandb>=0.15.4",
    "tensorboard>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/NavisWORLD/infinite-adaptive-audio-12d-universe-engine"
Documentation = "https://github.com/NavisWORLD/infinite-adaptive-audio-12d-universe-engine#readme"
Repository = "https://github.com/NavisWORLD/infinite-adaptive-audio-12d-universe-engine"
"Bug Tracker" = "https://github.com/NavisWORLD/infinite-adaptive-audio-12d-universe-engine/issues"

[project.scripts]
cosmic-train = "train_cosmic_transformer:main"
cosmic-infer = "inference_cosmic_transformer:main"
cosmic-demo = "demo_cosmic_transformer:main"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=. --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
