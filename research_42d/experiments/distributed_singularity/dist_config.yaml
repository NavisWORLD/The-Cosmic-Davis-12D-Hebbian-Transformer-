# Distributed Training Configuration
# Load this using PyYAML in the future if moving away from argparse

model:
  type: "42D" # or "12D"
  d_model: 256
  n_layers: 6
  n_heads: 8
  vocab_size: 30000

training:
  batch_size: 32 # Per GPU
  learning_rate: 3.0e-4
  max_epochs: 100
  log_interval: 10

distributed:
  backend: "nccl" # Use "gloo" for Windows/CPU
  master_port: 12355
